<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taxclara.az — Bəyannamə hazırlama və uyğunsuzluq auditi</title>
<style>
  :root{
    --paper:#F6F4EE; --card:#FFFFFF; --ink:#14202E; --inkSoft:#51616F;
    --inkFaint:#8A97A2; --hair:#E4E0D6; --hairSoft:#EFECE4;
    --brass:#A67C2E; --brassBg:#F3ECDC;
    --ok:#1E6B52; --okBg:#E7F1EC; --flag:#A5341F; --flagBg:#F6E7E3;
    --review:#9A6A12; --reviewBg:#F5EBD6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.4;
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px;}

  /* masthead */
  header.top{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:20px;border-bottom:1px solid var(--hair);margin-bottom:24px;}
  .brandrow{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .logo{width:36px;height:36px;border-radius:9px;background:var(--ink);
    display:flex;align-items:center;justify-content:center;}
  .brand-t{font-weight:600;font-size:15px;letter-spacing:-.2px;}
  .brand-t .dot{color:var(--brass);}
  .brand-s{font-size:11px;color:var(--inkFaint);margin-top:1px;}
  .statuschip{display:flex;align-items:center;gap:7px;border-radius:999px;
    padding:6px 12px;border:1px solid;font-size:12px;font-weight:500;}

  /* dashboard */
  .dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;}
  .dash-head h1{font-size:20px;font-weight:600;}
  .dash-head p{font-size:12.5px;color:var(--inkSoft);margin-top:4px;}
  .periods{display:grid;gap:12px;}
  .period{display:flex;align-items:center;gap:16px;padding:16px 18px;cursor:pointer;
    transition:border-color .12s,box-shadow .12s;}
  .period:hover{border-color:var(--brass);box-shadow:0 1px 0 var(--brassBg);}
  .period .pic{width:40px;height:40px;border-radius:9px;background:var(--ink);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .period .co{flex:1;min-width:0;}
  .period .co .nm{font-weight:600;font-size:14.5px;}
  .period .co .meta{font-size:11.5px;color:var(--inkFaint);margin-top:3px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .period .yr{font-family:ui-monospace,monospace;font-size:12px;color:var(--inkSoft);
    padding:3px 9px;border-radius:6px;background:var(--hairSoft);}

  /* dashboard (icmal) */
  .kpirow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .kpi{padding:15px 16px;display:flex;flex-direction:column;gap:9px;}
  .kpi-i{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .kpi-v{font-size:23px;font-weight:700;line-height:1;}
  .kpi-l{font-size:11.5px;color:var(--inkFaint);}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;}
  .widget{overflow:hidden;}
  .widget.wide{grid-column:1 / -1;}
  .whead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--hairSoft);}
  .wt{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;}
  .wbadge{font-size:11px;font-weight:600;background:var(--hairSoft);color:var(--inkSoft);padding:1px 8px;border-radius:999px;}
  .wbadge.flagbadge{background:var(--flagBg);color:var(--flag);}
  .wbody{padding:4px 0;}
  .lrow{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--hairSoft);}
  .lrow:last-child{border-bottom:none;}
  .lrow[data-open]{cursor:pointer;transition:background .12s;}
  .lrow[data-open]:hover{background:var(--hairSoft);}
  .sev{width:8px;height:8px;border-radius:999px;flex-shrink:0;}
  .lmain{flex:1;min-width:0;}
  .lt{font-size:12.5px;font-weight:500;}
  .lc{font-size:11px;color:var(--inkFaint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lval{font-size:12.5px;font-weight:600;white-space:nowrap;}
  .lright{text-align:right;display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .pipeline{display:flex;gap:8px;padding:16px;}
  .pipe{flex:1;text-align:center;padding:12px 6px;border:1px solid var(--hair);border-radius:9px;}
  .pipev{font-size:21px;font-weight:700;line-height:1;}
  .pipel{font-size:10.5px;color:var(--inkFaint);margin-top:6px;}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;font-size:12.5px;}
  .frow span:first-child{color:var(--inkSoft);}
  .fsep{height:1px;background:var(--hairSoft);margin:5px 16px;}
  .actrow{display:flex;gap:11px;padding:10px 16px;border-bottom:1px solid var(--hairSoft);}
  .actrow:last-child{border-bottom:none;}
  .actdot{width:7px;height:7px;border-radius:999px;background:var(--brass);margin-top:5px;flex-shrink:0;}
  .empty{padding:16px;font-size:12px;color:var(--inkFaint);text-align:center;}
  @media(max-width:760px){.kpirow{grid-template-columns:1fr 1fr;}.dgrid{grid-template-columns:1fr;}}

  /* layout */
  .cols{display:flex;gap:24px;}
  nav.steps{width:208px;flex-shrink:0;}
  .backrow{margin-bottom:14px;}
  .backbtn{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--inkSoft);
    background:transparent;border:none;cursor:pointer;padding:4px 0;}
  .backbtn:hover{color:var(--ink);}
  .steplist{display:flex;flex-direction:column;gap:6px;}
  .step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;
    text-align:left;background:transparent;border:none;cursor:pointer;color:var(--inkSoft);
    font-size:13px;font-family:inherit;width:100%;transition:background .12s;}
  .step:hover{background:var(--hairSoft);}
  .step.on{background:var(--ink);color:#fff;}
  .step .num{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:2px;color:var(--inkFaint);}
  .step.on .num{color:var(--brass);}
  .step .lbl{flex:1;font-weight:500;}
  .step .fdot{width:6px;height:6px;border-radius:999px;background:var(--flag);}
  .step.on .fdot{background:var(--brass);}
  main{flex:1;min-width:0;}

  /* view head */
  .vhead{margin-bottom:20px;}
  .vhead .r{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .vhead .n{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:3px;color:var(--brass);}
  .vhead h2{font-size:18px;font-weight:600;}
  .vhead p{font-size:12.5px;color:var(--inkSoft);max-width:560px;}

  /* generic */
  .card{background:var(--card);border:1px solid var(--hair);border-radius:12px;}
  .pill{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}

  /* sources */
  .src{display:flex;gap:14px;padding:16px;}
  .src .ic{width:36px;height:36px;border-radius:9px;background:var(--hairSoft);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .src .nm{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .src .nm span{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .src .note{font-size:11.5px;color:var(--inkFaint);margin-top:2px;}
  .src .det{font-size:12px;color:var(--inkSoft);margin-top:6px;}

  /* sources — sənəd yükləmə */
  .profwrap{margin-bottom:16px;}
  .proflbl{font-size:11.5px;color:var(--inkFaint);margin-bottom:8px;}
  .profbar{display:flex;gap:8px;flex-wrap:wrap;}
  .ptog{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-family:inherit;cursor:pointer;
    padding:7px 12px;border-radius:999px;border:1px solid var(--hair);background:var(--card);color:var(--inkSoft);transition:all .12s;}
  .ptog .pdot{width:8px;height:8px;border-radius:999px;background:var(--inkFaint);flex-shrink:0;transition:background .12s;}
  .ptog.on{border-color:var(--ink);background:var(--ink);color:#fff;}
  .ptog.on .pdot{background:var(--brass);}
  .docs{display:grid;gap:10px;}
  .doc{display:flex;gap:14px;padding:14px 16px;align-items:center;}
  .doc .ic{width:36px;height:36px;border-radius:9px;background:var(--hairSoft);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dmain{flex:1;min-width:0;}
  .dt{font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .condtag{font-size:10px;font-weight:500;padding:1px 7px;border-radius:999px;
    background:var(--brassBg);color:var(--brass);border:1px solid var(--brass)33;}
  .dwhy{font-size:11.5px;color:var(--inkFaint);margin-top:3px;}
  .dfile{font-size:11.5px;color:var(--inkSoft);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .dfile .fn{font-weight:500;}
  .dfile .fsz{color:var(--inkFaint);}
  .dfile .fmeta{color:var(--inkFaint);}
  .dact{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
  .dbtns{display:flex;align-items:center;gap:6px;}
  .dbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:inherit;cursor:pointer;
    padding:6px 12px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;transition:opacity .12s;}
  .dbtn:hover{opacity:.88;}
  .dbtn.ghost{background:transparent;color:var(--inkSoft);border-color:var(--hair);}
  .dbtn.del{background:transparent;border-color:var(--hair);padding:6px 8px;}
  .dbtn[disabled]{opacity:.4;cursor:not-allowed;}
  .dbtn[disabled]:hover{opacity:.4;}
  .clsactions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;flex-wrap:wrap;}
  .clsstatus{font-size:12.5px;font-weight:500;}
  .clsbtns{display:flex;align-items:center;gap:8px;}
  .dsec{font-size:12px;font-weight:600;color:var(--ink);margin:22px 0 10px;}
  .dsec span{font-weight:400;color:var(--inkFaint);}
  @media(max-width:640px){
    .doc{flex-wrap:wrap;}
    .dact{flex-direction:row;width:100%;justify-content:space-between;align-items:center;}
  }

  /* classify */
  .cprog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--inkSoft);margin-bottom:12px;}
  .cprog b{color:var(--ink);}
  .crow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hairSoft);}
  .crow:last-child{border-bottom:none;}
  .chk{width:20px;height:20px;border-radius:6px;border:1px solid var(--inkFaint);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:transparent;}
  .chk.on{background:var(--ok);border-color:var(--ok);}
  .crow .cn{flex:1;min-width:0;}
  .crow .cn .t{font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .crow .cn .norm{font-size:11px;color:var(--inkFaint);margin-top:2px;}
  .normtag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--review);}
  .normcalc{margin-top:6px;background:var(--paper);border:1px solid var(--hairSoft);border-radius:8px;padding:8px 10px;}
  .normgrid{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--inkSoft);}
  .normgrid b{color:var(--ink);font-variant-numeric:tabular-nums;}
  .normmeta{font-size:10.5px;color:var(--inkFaint);margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .normmeta b{color:var(--brass);}
  .normcalcl{font-size:10.5px;color:var(--inkFaint);margin-top:3px;font-family:var(--font-mono);}
  .vflag2{display:inline-flex;align-items:center;gap:3px;color:var(--review);background:var(--reviewBg);border-radius:4px;padding:0 5px;}
  .rulerow{display:flex;flex-direction:column;gap:5px;padding:12px 16px;border-bottom:1px solid var(--hairSoft);font-size:11.5px;}
  .rulerow:last-child{border-bottom:none;}
  .rulerow .rid{font-family:var(--font-mono);font-weight:600;color:var(--brass);font-size:12px;}
  .rulefields{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--inkSoft);}
  .rulefields span b{color:var(--ink);}
  .amt{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--inkSoft);}
  .clsinput{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink);text-align:right;
    width:110px;padding:5px 8px;border:1px solid var(--hair);border-radius:6px;background:#fff;transition:border-color .12s;}
  .clsinput:hover{border-color:var(--inkFaint);}
  .clsinput:focus{outline:none;border-color:var(--brass);background:var(--paper);}
  .clsdel{width:26px;height:26px;border-radius:7px;border:1px solid var(--hair);background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;}
  .clsdel:hover{background:var(--flagBg);border-color:var(--flag)55;}
  .clsdeleted{font-size:11.5px;color:var(--inkFaint);margin-top:10px;display:flex;align-items:center;gap:6px;}
  .clsdeleted a{color:var(--brass);cursor:pointer;font-weight:500;}
  .lossrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 16px;border-bottom:1px solid var(--hairSoft);}
  .lossrow:last-child{border-bottom:none;}
  .lossrow.losstot{background:var(--brassBg);}
  .lossyr{font-size:13px;font-weight:500;}
  .bractions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--hairSoft);}
  .brcustom{width:100%;}
  .brcbasis{flex:1;min-width:180px;font-family:inherit;font-size:12.5px;color:var(--ink);
    padding:7px 10px;border:1px solid var(--hair);border-radius:7px;background:#fff;}
  .brcbasis:focus{outline:none;border-color:var(--brass);}
  .brconfirmed{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ok);}

  /* reconcile */
  .stats{display:flex;gap:12px;margin-bottom:16px;}
  .stat{flex:1;border:1px solid var(--hair);background:var(--card);border-radius:9px;padding:10px 14px;}
  .stat .v{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;line-height:1;}
  .stat .l{font-size:11px;color:var(--inkFaint);margin-top:6px;}
  .bridges{display:grid;gap:14px;}
  .bhead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--hairSoft);}
  .bhead .t{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;}
  .bbody{padding:16px 20px;}
  .brow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;}
  .brow .lb{font-size:12.5px;}
  .brow .vl{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;}
  .basis{font-size:11px;line-height:1.35;margin-top:2px;padding-left:12px;color:var(--inkFaint);}
  .bline{margin-top:8px;}
  .bsep{margin-top:12px;padding-top:12px;border-top:1px solid var(--hairSoft);}
  .verdict{margin-top:12px;border-radius:9px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;}
  .verdict .vt{font-size:12.5px;font-weight:500;}
  .verdict .vn{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;}
  .verdict p{font-size:12px;line-height:1.35;margin-top:4px;color:var(--inkSoft);}

  /* declaration */
  .drow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hairSoft);}
  .drow:last-child{border-bottom:none;}
  .dcode{font-family:ui-monospace,monospace;font-size:11px;padding:2px 6px;border-radius:4px;background:var(--hairSoft);color:var(--inkSoft);}
  .drow .dn{flex:1;min-width:0;}
  .drow .dn .t{font-weight:500;font-size:13px;}
  .drow .dn .s{font-size:11px;color:var(--inkFaint);margin-top:2px;display:flex;align-items:center;gap:4px;}
  .dval{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13.5px;}
  .dsec2{font-size:10.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--brass);
    padding:12px 16px 6px;border-bottom:1px solid var(--hairSoft);background:var(--paper);}
  .dcode.vcode{background:transparent;border:1px dashed var(--inkFaint)66;color:var(--inkFaint);}
  .vflag{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--review);margin-left:6px;font-weight:500;}
  .noticebar{margin-top:12px;border-radius:9px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start;background:var(--flagBg);}
  .noticebar p{font-size:12px;line-height:1.35;color:var(--inkSoft);}

  footer{margin-top:32px;padding-top:20px;border-top:1px solid var(--hair);
    font-size:11px;line-height:1.6;color:var(--inkFaint);}

  @media(max-width:760px){
    .cols{flex-direction:column;}
    nav.steps{width:100%;}
    .steplist{flex-direction:row;overflow-x:auto;padding-bottom:4px;}
    .step{white-space:nowrap;}
  }
  .hide-sm{}
  @media(max-width:640px){.hide-sm{display:none!important;}}

  /* ══ ictimai sayt ══ */
  /* public header */
  .pubhead{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 0;border-bottom:1px solid var(--hair);margin-bottom:32px;}
  .pubnav{display:flex;align-items:center;gap:4px;}
  .pubnav a{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--inkSoft);cursor:pointer;transition:all .12s;}
  .pubnav a:hover{background:var(--hairSoft);color:var(--ink);}
  .pubnav a.on{color:var(--ink);font-weight:500;}
  .pubauth{display:flex;align-items:center;gap:8px;}
  .btnp{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-family:inherit;cursor:pointer;
    padding:9px 16px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:#fff;transition:opacity .12s;}
  .btnp:hover{opacity:.88;}
  .btnp.brass{background:var(--brass);border-color:var(--brass);}
  .btng{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-family:inherit;cursor:pointer;
    padding:9px 16px;border-radius:9px;border:1px solid var(--hair);background:transparent;color:var(--ink);transition:all .12s;}
  .btng:hover{border-color:var(--ink);}
  .btnp.lg,.btng.lg{padding:12px 22px;font-size:14px;}

  /* hero */
  .hero{text-align:center;padding:40px 0 44px;}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--brass);
    background:var(--brassBg);border:1px solid var(--brass)33;padding:6px 12px;border-radius:999px;margin-bottom:20px;}
  .hero h1{font-size:38px;line-height:1.12;font-weight:700;letter-spacing:-.5px;max-width:720px;margin:0 auto;}
  .hero h1 .hl{color:var(--brass);}
  .hero .lead{font-size:15.5px;line-height:1.55;color:var(--inkSoft);max-width:560px;margin:18px auto 26px;}
  .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .trust{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:30px;
    font-size:12px;color:var(--inkFaint);}
  .trust span{display:inline-flex;align-items:center;gap:6px;}

  /* section */
  .section{padding:38px 0;border-top:1px solid var(--hair);}
  .section-h{text-align:center;margin-bottom:30px;}
  .section-h .k{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:3px;color:var(--brass);}
  .section-h h2{font-size:26px;font-weight:700;letter-spacing:-.3px;margin-top:8px;}
  .section-h p{font-size:14px;color:var(--inkSoft);max-width:560px;margin:10px auto 0;}

  /* features */
  .fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:760px){.fgrid{grid-template-columns:1fr;}}
  .fcard{padding:20px;}

  const residual=Math.round((expected-b.actual.value)*100)/100;
  return {...b,expected,residual,flagged:Math.abs(residual)>b.tol};

function brRes(pid,id){ return (state.brResolve[pid]||{})[id]; }
function brConf(pid,id){ return !!(state.brConfirm[pid]||{})[id]; }

const MF_OPTIONS={
  uchot:['hesablama metodu','kassa metodu'],

  meyar:['Mikro','Kiçik','Orta','İRİ'],
};
function mfGenFor(pid){
  if(!state.mfGen[pid]) state.mfGen[pid]={uchot:'hesablama metodu',group:MF_OPTIONS.group[0],meyar:'Kiçik'};
  return state.mfGen[pid];
}
function parseNum(v){
  v=String(v).trim().replace(/[  ]/g,'');
  if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
  const n=parseFloat(v); return isNaN(n)?0:n;
}
const PUBLIC_VIEWS=['landing','how','about','contact'];
const AUTH_VIEWS=['login','register'];
function go(v){
  if((v==='app'||v==='audit')&&!state.authed){state.view='login';window.scrollTo(0,0);render();return;}
  state.view=v;window.scrollTo(0,0);render();
}
// Dövr açılanda profil və əvvəlcədən yüklənmiş faylları hazırla
function openPeriod(id){
  state.view='audit';state.periodId=id;state.step='sources';state.confirmed={};
  const p=PERIODS.find(x=>x.id===id);
  state.profile={...p.profile};
  state.uploads={};
  p.docs.forEach(d=>{ if(d.pre) state.uploads[d.id]={name:d.pre.name,size:null,meta:d.pre.meta,review:!!d.pre.review}; });
}
const period=()=>PERIODS.find(p=>p.id===state.periodId);
const results=()=>period().bridges.map(runBridge);
const flaggedCount=()=>results().filter(r=>r.flagged&&!brRes(state.periodId,r.id)).length;

/* ── helpers ── */
function pill(text,c,bg){return `<span class="pill" style="color:${C(c)};background:${C(bg)};border-color:${C(c)}33">${text}</span>`;}
function vhead(n,t,d){return `<div class="vhead"><div class="r"><span class="n">${n}</span><h2>${t}</h2></div><p>${d}</p></div>`;}
function brow(label,value,{strong,muted,accent}={}){
  const col=accent?C('brass'):muted?C('inkSoft'):C('ink');
  const w=(strong||accent)?600:500;
  return `<div class="brow"><span class="lb" style="color:${muted?C('inkSoft'):C('ink')};${(strong||accent)?'font-weight:500':''}">${label}</span>
    <span class="vl" style="color:${col};font-weight:${w}">${azn(value)}</span></div>`;
}

function periodRequiredDocs(p){ return p.docs.filter(d=>d.tier==='core'||(d.tier==='cond'&&p.profile[d.cond])); }
function periodMissing(p){ return periodRequiredDocs(p).filter(d=>!d.pre); }
function allRisks(){
  const out=[];
  PERIODS.forEach(p=>p.bridges.map(runBridge).filter(r=>r.flagged).forEach(r=>
    out.push({company:p.company, id:p.id, title:r.title, residual:Math.abs(r.residual)})));
  return out.sort((a,b)=>b.residual-a.residual);
}
function totalMissing(){ return PERIODS.reduce((s,p)=>s+periodMissing(p).length,0); }
function totalTaxLiability(){ return PERIODS.reduce((s,p)=>s+buildDeclaration(p.declInput).tax,0); }
function pipeline(){
  const map={HAZIRLANIR:{status:'Hazırlanır',tone:'inkFaint'},'BAXIŞ':{status:'Baxışda',tone:'brass'},
    'TƏSDİQ':{status:'Təsdiq gözləyən',tone:'review'},HAZIR:{status:'Təqdim üçün hazır',tone:'ok'}};
  return ['HAZIRLANIR','BAXIŞ','TƏSDİQ','HAZIR'].map(k=>({...map[k],count:PERIODS.filter(p=>p.status===k).length}));
}
function sevOf(v){ return v>=5000?'flag':v>=2000?'review':'brass'; }

function wcard(title,icon,body,badge,wide){
  return `<div class="card widget${wide?' wide':''}">
    <div class="whead"><div class="wt">${svg(I[icon],{size:15,color:C('brass')})} ${title}</div>
      ${badge!=null?`<span class="wbadge${badge&&badge.flag?' flagbadge':''}">${badge.text!==undefined?badge.text:badge}</span>`:''}</div>
    <div class="wbody">${body}</div></div>`;
}

const PROFILE_LABELS={vat:'ƏDV qeydiyyatı',withholding:'İcarə / qeyri-rezident ödəniş',travel:'Ezamiyyə xərci',fixedAssets:'Əsas vəsait',exemption:'Azadolma / güzəşt'};
const isRequired=d=>d.tier==='core'||(d.tier==='cond'&&state.profile[d.cond]);
const isShown=d=>d.tier==='suggest'||isRequired(d);
const requiredDocs=()=>period().docs.filter(isRequired);
const missingReq=()=>requiredDocs().filter(d=>!state.uploads[d.id]).length;

function fileSize(b){ if(b==null)return ''; if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

function docRow(d){
  const up=state.uploads[d.id];
  const required=isRequired(d);
  let sc,sbg,slabel,sicon;
  if(up){ if(up.review){sc='review';sbg='reviewBg';slabel='Baxılmalı';sicon=I.shieldQ;}
          else {sc='ok';sbg='okBg';slabel='Əlavə edildi';sicon=I.shieldOk;} }
  else if(required){ sc='flag';sbg='flagBg';slabel='Çatışmır';sicon=I.warn; }
  else { sc='inkFaint';sbg='hairSoft';slabel='Tövsiyə olunur';sicon=I.file; }
  const condtag=d.tier==='cond'?`<span class="condtag">${PROFILE_LABELS[d.cond]}</span>`:'';
  const fileLine=up
    ? `<div class="dfile">${svg(I.file,{size:12,color:C('inkSoft')})}<span class="fn">${up.name}</span>${up.size!=null?`<span class="fsz">${fileSize(up.size)}</span>`:''}${up.meta?`<span class="fmeta">· ${up.meta}</span>`:''}</div>`
    : '';
  const actions=up
    ? `<button class="dbtn ghost" data-upload="${d.id}">Dəyişdir</button><button class="dbtn del" data-remove="${d.id}" title="Sil">${svg(I.warn,{size:13,color:C('flag')})}</button>`
    : `<button class="dbtn" data-upload="${d.id}">${svg(I.file,{size:13,color:'#fff'})} Fayl seç</button>`;
  return `<div class="card doc">
    <div class="ic">${svg(I[d.ic],{color:C('ink'),size:17})}</div>
    <div class="dmain">
      <div class="dt"><span>${d.name}</span>${condtag}</div>
      <div class="dwhy">${d.why}</div>
      ${fileLine}
    </div>
    <div class="dact">
      <span class="pill" style="color:${C(sc)};background:${C(sbg)};border-color:${C(sc)}33">${slabel}</span>
      <div class="dbtns">${actions}</div>
    </div>
  </div>`;
}

// Norma hesablamasının detallı göstərişi (istifadə/icazə/çıxılan/çıxılmayan + hüquqi əsas)
function normBreakdown(p,i){
  const n=normCalc(p,i), rule=n.rule;
  const calcLine = rule
    ? (rule.calculation_method==='daily_amount'
        ? `${n.days} gün × ${azn(rule.parameter)}/gün = ${azn(n.allowed)}`
        : `${n.baseLabel} ${azn(n.base)} × ${rule.parameter}% = ${azn(n.allowed)}`)
    : '';
  return `<div class="normcalc">
    <div class="normgrid">
      <span>Xərc: <b>${azn(n.used)}</b></span>
      <span>İcazə verilən: <b style="color:${C('ok')}">${azn(n.allowed)}</b></span>
      <span>Çıxılan: <b style="color:${C('ok')}">${azn(n.deductible)}</b></span>
      <span>Çıxılmayan: <b style="color:${C(n.excess>0?'flag':'inkFaint')}">${azn(n.excess)}</b></span>
    </div>
    <div class="normmeta">${svg(I.scale,{size:11,color:C('brass')})} Hüquqi əsas: <b>${rule?rule.rule_id:'—'}</b>${rule?` · ${rule.article} · ${rule.effective_from}—${rule.effective_to}`:''}${rule&&!rule.verified?` <span class="vflag2">${svg(I.warn,{size:9,color:C('review')})} təsdiqlənməli</span>`:''}</div>
    <div class="normcalcl">Hesablanma: ${calcLine}${n.excess>0?` · artıq ${azn(n.excess)} mənfəətə əlavə olunur`:''}</div>
  </div>`;
}
function viewClassify(){

  const deletedIdx=list.map((_,i)=>i).filter(i=>del[i]);
  const done=activeIdx.filter(i=>state.confirmed[i]).length;
  const rows=activeIdx.map(i=>{
    const r=list[i], cl=CLS[r.s], on=state.confirmed[i];
    const editable=(r.s==='limit'||r.s==='nondeduct');

      ? `<input class="clsinput" data-clsamt="${i}" value="${fmt2(amt)}" inputmode="decimal" title="Çıxılan məbləği dəyişin" />`

    +`<div class="cprog"><b class="mono">${done}</b> / ${total} sətir təsdiqləndi</div>
      <div class="card">${rows}</div>
      ${deletedStrip}

        <div class="card">
          <div class="lossrow"><span class="lossyr">Bu ekranda icmal edilən (çıxılan hissə)</span><span class="amt">${azn(itemized)}</span></div>

function bridge(b){
  const pid=state.periodId, flagged=b.flagged;
  const res=brRes(pid,b.id), conf=brConf(pid,b.id);
  const resolved=!flagged||!!res;
  const effResidual=res?round2(Math.abs(b.residual)-res.amount):Math.abs(b.residual);
  const sc=resolved?C('ok'):C('flag'), sbg=resolved?C('okBg'):C('flagBg');
  const lines=b.lines.map(l=>`<div class="bline">${brow(l.label,l.value,{muted:true})}<div class="basis">${l.basis}</div></div>`).join('');
  const adjVal=res?-(b.residual<0?-1:1)*res.amount:0;
  const resLine=res?`<div class="bline">${brow('(±) '+(res.type==='auto'?'Avtomatik qanuni düzəliş':'Mühasibin izahı'),adjVal,{muted:true})}<div class="basis">${res.basis||''}</div></div>`:'';
  const headPill=resolved?pill(!flagged?'Uzlaşdı':'Həll olundu','ok','okBg'):pill(`İzahsız ${azn(effResidual)}`,'flag','flagBg');
  let action='';
  if(flagged&&!res){
    if(state.brCustom===b.id){
      action=`<div class="bractions brcustom">
        <input class="clsinput" data-brcamt="${b.id}" value="${fmt2(Math.abs(b.residual))}" inputmode="decimal" />
        <input class="brcbasis" data-brcbasis="${b.id}" placeholder="İzahın hüquqi əsası / qeyd" />
        <button class="dbtn" data-brcapply="${b.id}">Tətbiq et</button>
        <button class="dbtn ghost" data-brccancel>Ləğv</button></div>`;
    } else {
      action=`<div class="bractions">
        <button class="dbtn" data-brauto="${b.id}">${svg(I.scale,{size:13,color:'#fff'})} Avtomatik qanuni düzəliş</button>
        <button class="dbtn ghost" data-brcustomopen="${b.id}">${svg(I.scan,{size:13,color:C('inkSoft')})} Öz izahımı əlavə et</button></div>`;
    }
  } else {
    action=conf
      ? `<div class="bractions"><span class="brconfirmed">${svg(I.check,{size:14,color:C('ok')})} Təsdiqləndi</span><button class="dbtn ghost" data-brunconfirm="${b.id}">Geri al</button></div>`
      : `<div class="bractions"><button class="dbtn" data-brconfirm="${b.id}">${svg(I.check,{size:13,color:'#fff'})} Bu uyğunsuzluğu təsdiqlə</button>${res?`<button class="dbtn ghost" data-brreset="${b.id}">Düzəlişi ləğv et</button>`:''}</div>`;
  }
  const verdictLabel=resolved?(conf?'Təsdiqləndi':'İzah olundu — təsdiq gözləyir'):'İzah olunmayan qalıq';
  const verdictMsg=!resolved?(b.note||'Bu məbləğ bilinən qanuni düzəlişlərlə izah olunmur — təqdimatdan əvvəl yoxlanmalıdır.'):'';
  return `<div class="card">
    <div class="bhead">
      <div class="t">${resolved?svg(I.ok,{size:17,color:C('ok')}):svg(I.warn,{size:17,color:C('flag')})}${b.title}</div>
      ${headPill}
    </div>
    <div class="bbody">
      ${brow(b.start.label,b.start.value,{strong:true})}
      ${lines}${resLine}
      <div class="bsep">${brow(b.expectedLabel,b.expected,{accent:true})}</div>
      <div style="margin-top:6px">${brow(b.actual.label,b.actual.value)}</div>
      <div class="verdict" style="background:${sbg}">
        <div style="margin-top:1px">${resolved?svg(I.check,{size:16,color:C('ok')}):svg(I.warn,{size:16,color:C('flag')})}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <span class="vt" style="color:${sc}">${verdictLabel}</span>
            <span class="vn" style="color:${sc}">${azn(effResidual)}</span>
          </div>
          ${verdictMsg?`<p>${verdictMsg}</p>`:''}
        </div>
      </div>
      ${action}
    </div>
  </div>`;
}

// Mənfəət bəyannaməsi — rəsmi MENFEET_1 formatı göstərici kodları (bax: docs/06).
// Vergi tutulan mənfəət = gəlir − çıxılan xərclər + vergi düzəlişi (işarəli) − istifadə olunan zərər.
// Nəticə mənfidirsə → 3002 (Zərər), vergi tutulan mənfəət (3001) = 0, vergi = 0.
// Kodlar 1001/2073/3001/3002/3004/3005 real fayldan təsdiqlənib; düzəliş/zərər alt-kodları XSD ilə təsdiqlənməli.
function buildDeclaration(inp){
  const base=inp.revenue - inp.deductible + inp.taxAdjust - inp.lossUsed;
  const profit=Math.max(0, base), loss=Math.max(0, -base);
  const tax=Math.round(profit*inp.rate*100)/100;
  const adjOp=inp.taxAdjust<0?'−':'+';
  const cells=[
    {sec:'Gəlir',code:'1001',label:'Ümumi gəlir',value:inp.revenue,op:'',src:'ƏDV körpüsü + e-Qaimə'},
    {sec:'Xərclər',code:'2073',label:'Gəlirdən çıxılan xərclərin cəmi',value:inp.deductible,op:'−',src:'Təsnifat (çıxılan)'},
  ];
  if(inp.taxAdjust) cells.push({sec:'Düzəlişlər',code:'—',label:'Vergi düzəlişləri (amortizasiya fərqi)',value:Math.abs(inp.taxAdjust),op:adjOp,src:'Mühasibat ≠ vergi amortizasiyası',verify:true});
  if(inp.lossUsed) cells.push({sec:'Düzəlişlər',code:'—',label:'Köçürülən zərərin istifadəsi',value:inp.lossUsed,op:'−',src:'Zərər körpüsü',verify:true});
  if(loss>0){
    cells.push({sec:'Vergi hesabı',code:'3002',label:'Zərər',value:loss,op:'=',src:'Xərclər gəliri üstələyir — vergi tutulan mənfəət yoxdur',strong:true});
    cells.push({sec:'Vergi hesabı',code:'3001',label:'Vergi tutulan mənfəət',value:0,op:'',src:'Zərərli dövr'});
  } else {
    cells.push({sec:'Vergi hesabı',code:'3001',label:'Vergi tutulan mənfəət',value:profit,op:'=',src:`1001 − 2073 ${adjOp} düzəlişlər`,strong:true});
  }
  cells.push({sec:'Vergi hesabı',code:'3005',label:'Mənfəət vergisinin dərəcəsi',value:inp.rate*100,op:'',src:'Cari qayda (2025)',pct:true});
  cells.push({sec:'Vergi hesabı',code:'3004',label:'Hesablanmış mənfəət vergisi',value:tax,op:'',src:`3001 × ${inp.rate*100}%`,strong:true});
  return {profit,loss,tax,cells};
}

function fmt2(n){
  const cents=Math.round(Math.abs(n)*100), int=Math.floor(cents/100), frac=cents%100;
  const g=String(int).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (n<0?'-':'')+g+','+String(frac).padStart(2,'0');
}

/* ── XML ixracı (MENFEET_1 strukturu) ──
   DİQQƏT: göstərici (gosterici) kodları rəsmi MENFEET_1.xsd ilə təsdiqlənməlidir.
   Real file.xml-də daxili kodlar fərqlidir (1001/2001/3001/4001); burada formanın
   göstərici kodları (200/221/237/1/3) istifadə olunur — XSD gələndə map ediləcək. */
function xmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function xmlNum(n){ return (Math.round((n||0)*100)/100).toFixed(2); }
function xmlRows(arr){ return arr.map(r=>`      <row><gosterici>${r[0]}</gosterici><mebleg>${xmlNum(r[2])}</mebleg></row>`).join('\n'); }
function xmlRows6(arr){ return arr.map(r=>
  `      <row><gosterici>${r[0]}</gosterici><evvel>${xmlNum(r[2])}</evvel><daxilOlan>${xmlNum(r[3])}</daxilOlan><teqdim>${xmlNum(r[4])}</teqdim><silinmis>${xmlNum(r[5])}</silinmis><legv>${xmlNum(r[6])}</legv><sonu>${xmlNum(r[7])}</sonu></row>`).join('\n'); }
function buildMenfeetXML(){
  const p=period(), D=mfDataFor(p);
  const actKod=(p.activity||' - ').split(' - ')[0].trim();
  const actAd=(p.activity||' - ').split(' - ').slice(1).join(' - ').trim();
  return `<?xml version="1.0" encoding="UTF-8"?>
<!-- Taxclara.az ixracı · MENFEET_1 strukturu (ilkin). DİQQƏT: göstərici kodları rəsmi MENFEET_1.xsd ilə təsdiqlənməlidir. -->
<beyanname kodVer="MENFEET_1" lang="az" error="xeta_yoxdur" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="MENFEET_1.xsd">
  <genel>
    <mukellef>
      <vergiNo>${xmlEsc(p.voen)}</vergiNo>
      <adi>${xmlEsc(p.company)}</adi>
    </mukellef>
    <beyanname>
      <faaliyetNovuKodu>${xmlEsc(actKod)}</faaliyetNovuKodu>
      <faaliyetNovuAdi>${xmlEsc(actAd)}</faaliyetNovuAdi>
      <beyannameTipi>0</beyannameTipi>
    </beyanname>
    <donem><tip>2</tip><yil>${MF_META.dovr}</yil></donem>
  </genel>
  <ozel>
    <ucotMetodu>2</ucotMetodu>
    <gelirler>
${xmlRows(D.income)}
    </gelirler>
    <xercler>
${xmlRows(D.expense)}
    </xercler>
    <vergiHesab>
${xmlRows(D.taxcalc)}
    </vergiHesab>
    <aktivlerKapital>
${xmlRows6(D.balance)}
    </aktivlerKapital>
    <azadolmalarGuzestler>
${xmlRows(D.exemptInc)}
${xmlRows(D.exemptProfit)}
    </azadolmalarGuzestler>
  </ozel>
</beyanname>`;
}
function downloadMenfeetXML(){
  const p=period();
  const blob=new Blob([buildMenfeetXML()],{type:'application/xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`menfeet_2025_${p.voen}.xml`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* ── formula (aqreqasiya) mühərriki ──
   Hər redaktədən sonra asılı xanalar avtomatik yenidən hesablanır (deterministik).
   AGG: valideyn kodu = uşaq kodlarının cəmi. "O cümlədən" alt-sətirlər cəmə daxil deyil. */
const round2=n=>Math.round(n*100)/100;
/* ══ RULE ENGINE — versiyalı vergi qaydaları (deterministik) ══
   Hər qayda: rule_id · tax_type · effective_from/to · source · article · parameter ·
   calculation_method · jurisdiction · status · verified. Köhnə bəyannamə öz ilinin
   qaydası ilə hesablanır (effective_from/to). Dəyər verified:false isə təsdiqlənməlidir. */
const RULES=[
  {rule_id:'REP-INCOME-1PCT-2025', tax_type:'PROFIT', effective_from:'2025-01-01', effective_to:'2025-12-31',
   source:'e-qanun.az · Vergi Məcəlləsi', article:'VM 119?', jurisdiction:'AZ', status:'active', verified:false,
   category:'Təmsilçilik', calculation_method:'percent_of_income', parameter:1, param_label:'Hesabat dövrü gəlirinin 1%-i', base_label:'Ümumi gəlir (200)'},
  {rule_id:'TRAVEL-DAILY-2025', tax_type:'PROFIT', effective_from:'2025-01-01', effective_to:'2025-12-31',
   source:'Nazirlər Kabineti qərarı', article:'NK · ezamiyyə normaları', jurisdiction:'AZ', status:'active', verified:false,
   category:'Ezamiyyə', calculation_method:'daily_amount', parameter:120, param_label:'Gündəlik norma × gün sayı', base_label:'Ezamiyyə günləri'},
];
function ruleById(id){ return RULES.find(r=>r.rule_id===id); }
// Təsnifat redaktələri (məhdudlaşan/çıxılmayan sətir dəyişikliyi/silinməsi) → effektiv çıxılan xərc
function clsEffAmount(p,i){ const c=p.classify[i]; if((state.clsDel[p.id]||{})[i]) return 0; const a=(state.clsAmt[p.id]||{})[i]; return a!==undefined?a:c.amount; }
// Norma hesablaması: istifadə olunan / icazə verilən / çıxılan / artıq (çıxılmayan) + hüquqi əsas
function normCalc(p,i){
  const c=p.classify[i], amt=clsEffAmount(p,i), nm=c.normRule;
  if(!nm) return {used:amt,allowed:amt,deductible:amt,excess:0,rule:null};
  const rule=ruleById(nm.ruleId); let allowed=amt, base=0, baseLabel='';
  if(rule){
    if(rule.calculation_method==='percent_of_income'){ base=p.declInput.revenue||0; allowed=round2(base*rule.parameter/100); baseLabel=rule.base_label; }
    else if(rule.calculation_method==='percent_of_base'){ base=nm.base||0; allowed=round2(base*rule.parameter/100); baseLabel=rule.base_label; }
    else if(rule.calculation_method==='daily_amount'){ base=nm.days||0; allowed=round2(base*rule.parameter); baseLabel=rule.base_label; }
  }
  const deductible=round2(Math.min(amt,allowed)), excess=round2(Math.max(0,amt-allowed));
  return {used:amt,allowed,deductible,excess,rule,base,baseLabel,days:nm.days};
}
// Bir təsnifat sətrinin çıxılan hissəsi (norma limiti + silinmə tətbiq olunmuş)
function clsDeductible(p,i){
  const c=p.classify[i];
  if((state.clsDel[p.id]||{})[i]) return 0;
  if(c.s==='nondeduct') return 0;
  if(c.s==='limit') return normCalc(p,i).deductible;
  return clsEffAmount(p,i);
}
function effDeductible(p){ let d=p.declInput.deductible; (p.classify||[]).forEach((c,i)=>{ if(c.s==='nondeduct')return; d+=clsDeductible(p,i)-c.amount; }); return round2(d); }
function effLossUsed(p){ const E=state.mfEdits[p.id]||{}; let s=0; for(let n=1;n<=5;n++){const k='240.'+n; s+=(E[k]!==undefined?E[k]:(n===5?p.declInput.lossUsed:0));} return round2(s); }
function effDI(p){ return {...p.declInput, deductible:effDeductible(p), lossUsed:effLossUsed(p)}; }
const MF_INC_MAIN=['200','201','202','203','204','205','206','207','208','209','210','211','212','213','214','215','216','217'];
const MF_EXP_MAIN=['221','222','223','224','225','226','227','228','229','230','231','232','233'];
const AGG_INC={'200':['200.1','200.2'],'200.1':['200.1.1','200.1.2'],'203':['203.1','203.2'],'204':['204.1','204.2'],'207':['207.1','207.2','207.3','207.4','207.5','207.6'],'211':['211.1','211.2'],'212':['212.1','212.2'],'217':['217.1','217.2','217.3','217.4','217.5'],'219':['219.1','219.2','219.3','219.4','219.5','219.6','219.7']};
const AGG_EXP={'221':['221.1','221.2','221.3','221.4','221.5','221.6','221.7','221.8','221.9','221.10','221.11','221.12','221.13','221.14','221.15','221.16','221.17'],'221.1':['221.1.1','221.1.2'],'221.5':['221.5.1','221.5.2'],'221.5.1':['221.5.1.1','221.5.1.2'],'222':['222.1','222.2','222.3'],'222.2':['222.2.1','222.2.2'],'227':['227.1','227.2','227.3','227.4','227.5','227.6','227.7','227.8','227.9','227.10','227.11'],'227.6':['227.6.1','227.6.2'],'228':['228.1','228.2','228.3','228.4','228.5','228.6','228.7'],'229':['229.1','229.2'],'230':['230.1','230.2'],'230.1':['230.1.1','230.1.2','230.1.3'],'231':['231.1','231.2','231.3','231.4','231.5','231.6'],'232.4':['232.4.1','232.4.2'],'233':['233.1','233.2','233.3','233.4','233.5'],'235':['235.1','235.2','235.3'],'235.1':['235.1.1']};
const AGG_TAX={'240':['240.1','240.2','240.3','240.4','240.5'],'244':['244.1','244.2','244.3','244.4','244.5'],'249':['249.1','249.2','249.3']};
const AGG_BAL={'1':['1.1','1.2','1.3','1.4','1.5','1.6','1.7','1.8','1.9','1.10'],'1.1':['1.1.1','1.1.2','1.1.3','1.1.4','1.1.5','1.1.6','1.1.7','1.1.8'],'1.2':['1.2.1','1.2.2'],'1.3':['1.3.1','1.3.2','1.3.3','1.3.4'],'1.4':['1.4.1','1.4.2'],'2':['2.1','2.2'],'2.1':['2.1.1','2.1.2','2.1.3','2.1.4','2.1.5'],'2.2':['2.2.1','2.2.2','2.2.3'],'2.2.1':['2.2.1.1','2.2.1.2','2.2.1.3','2.2.1.4','2.2.1.5']};
const depth=c=>c.split('.').length;
// 2 sütunlu bölmə: redaktəni tətbiq et, AGG uşaqlarını topla, cəmləri hesabla. computed = read-only kodlar
function mfCalc2(rows,E,agg,mains,mainTotal,cross){
  const map={}; rows.forEach(r=>map[r[0]]=r); const g=c=>map[c]?map[c][2]:0; const computed=new Set();
  rows.forEach(r=>{ if(E[r[0]]!==undefined) r[2]=E[r[0]]; });
  Object.keys(agg).sort((a,b)=>depth(b)-depth(a)).forEach(code=>{ if(map[code]){ map[code][2]=round2(agg[code].reduce((s,c)=>s+g(c),0)); computed.add(code); }});
  if(mainTotal && map[mainTotal]){ map[mainTotal][2]=round2(mains.reduce((s,c)=>s+g(c),0)); computed.add(mainTotal); }
  (cross||[]).forEach(([code,fn])=>{ if(map[code]){ map[code][2]=round2(fn(g)); computed.add(code); }});
  return computed;
}
function mfCalcBal(rows,E){
  const map={}; rows.forEach(r=>map[r[0]]=r); const computed=new Set(); const isP=c=>!!AGG_BAL[c];
  rows.forEach(r=>{ for(let i=2;i<=7;i++){const k=r[0]+':'+i; if(E[k]!==undefined) r[i]=E[k];}});
  rows.forEach(r=>{ if(!isP(r[0])){ r[7]=round2(r[2]+r[3]-r[4]-r[5]-r[6]); computed.add(r[0]+':7'); }});
  Object.keys(AGG_BAL).sort((a,b)=>depth(b)-depth(a)).forEach(code=>{ if(map[code]){ for(let i=2;i<=7;i++){ map[code][i]=round2(AGG_BAL[code].reduce((s,c)=>s+(map[c]?map[c][i]:0),0)); computed.add(code+':'+i); }}});
  return computed;
}
// Cari dövr üçün MENFEET forma datası — ELITE tam real; digərləri declInput+classify-dən törənir; sonra formula mühərriki
function mfDataFor(p){
  const general=[
    ['Vergi orqanının adı','İqtisadiyyat Nazirliyi yanında Dövlət Vergi Xidmətinin müvafiq Gəlirlər Baş İdarəsi'],
    ['VÖEN',p.voen],
    ['Vergi ödəyicisinin tam adı',p.company],
    ['Əsas fəaliyyət növü',p.activity||'—'],
  ];
  let income,expense,taxcalc,balance;
  if(p.eliteFull){
    income=MF_INCOME.map(r=>r.slice()); expense=MF_EXPENSE.map(r=>r.slice());
    taxcalc=MF_TAXCALC.map(r=>r.slice()); balance=MF_BALANCE.map(r=>r.slice());
  } else {
    const di=effDI(p), rate=p.declInput.rate||0.20;
    // gəlir: dövriyyə 200.2 (xidmət) leaf-ə; recompute 200→218→220 törədir
    const incOv={'200.2':di.revenue};
    income=MF_INCOME.map(r=>[r[0],r[1],incOv[r[0]]!==undefined?incOv[r[0]]:0,r[3]]);
    // xərc: təsnifat (effektiv məbləğ, silinmiş sətirlər xaric) → leaf kodlar; qalıq 221.15; amort 227.2
    const catMap={'Əməkhaqqı':'221.1.2','İcarə':'221.5.1.2','Kommunal':'221.10','Reklam':'221.14','Xammal və materiallar':'221.3','Material':'221.3','Subpodrat':'221.15','Sair istehsal xərcləri':'221.15','Amortizasiya':'227.2','Ezamiyyə':'221.6','Nəqliyyat':'229.1'};
    const expOv={}; let mapped=0;
    (p.classify||[]).forEach((c,i)=>{ if(c.s==='nondeduct')return; if((state.clsDel[p.id]||{})[i])return; const amt=clsEffAmount(p,i); const code=catMap[c.name]; if(code){expOv[code]=(expOv[code]||0)+amt; mapped+=amt;} });
    const expTotal=round2(di.deductible-di.taxAdjust);
    const rest=round2(expTotal-mapped); if(rest>0) expOv['221.15']=(expOv['221.15']||0)+rest;
    expense=MF_EXPENSE.map(r=>[r[0],r[1],expOv[r[0]]!==undefined?expOv[r[0]]:0,r[3]]);
    taxcalc=MF_TAXCALC.map(r=>[r[0],r[1],(r[0]==='242'?rate*100:r[0]==='240.5'?p.declInput.lossUsed:0),r[3]]);
    balance=MF_BALANCE.map(r=>[r[0],r[1],0,0,0,0,0,0,r[8]]);
  }
  // ── formula mühərriki: redaktə + aqreqasiya ──
  const E=state.mfEdits[p.id]||{};
  const cInc=mfCalc2(income,E,AGG_INC,MF_INC_MAIN,'218',[['220',g=>g('218')-g('219')]]);
  const cExp=mfCalc2(expense,E,AGG_EXP,MF_EXP_MAIN,'234',[['236',g=>g('234')-g('235')]]);
  const g2=(rows,code)=>{const r=rows.find(x=>x[0]===code);return r?r[2]:0;};
  const inc220=g2(income,'220'), exp236=g2(expense,'236');
  const cTax=mfCalc2(taxcalc,E,AGG_TAX,null,null,[
    ['237',()=>Math.max(0,round2(inc220-exp236))],
    ['239',()=>Math.max(0,round2(exp236-inc220))],
    ['241',g=>Math.max(0,round2(g('237')-(g('238')+g('240'))))],
    ['243',g=>round2(g('241')*g('242')/100)],
    ['245',g=>round2(g('243')-g('244'))],
  ]);
  const cBal=mfCalcBal(balance,E);
  const exemptInc=MF_EXEMPT_INC.map(r=>r.slice()); const exemptProfit=MF_EXEMPT_PROFIT.map(r=>r.slice());
  const cEi=mfCalc2(exemptInc,E,{},MF_EXEMPT_INC.filter(r=>r[0]!=='29').map(r=>r[0]),'29',[]);
  const cEp=mfCalc2(exemptProfit,E,{},MF_EXEMPT_PROFIT.filter(r=>r[0]!=='42').map(r=>r[0]),'42',[]);
  // İcmal — taxcalc-dən
  const t=c=>g2(taxcalc,c);
  const summary=MF_SUMMARY.map(r=>{const m={'245':t('245'),'243':t('243'),'241':t('241'),'237':t('237'),'242':t('242'),'238':t('238'),'240':t('240'),'244':t('244')}; return [r[0],r[1],m[r[0]]!==undefined?m[r[0]]:0,r[3]];});
  return {general,income,expense,taxcalc,balance,exemptInc,exemptProfit,summary,
    computed:{income:cInc,expense:cExp,taxcalc:cTax,balance:cBal,exemptInc:cEi,exemptProfit:cEp}};
}

function viewDeclare(){
  const di=effDI(period());
  const {profit,loss,tax,cells}=buildDeclaration(di);
  const secOrder=['Gəlir','Xərclər','Düzəlişlər','Vergi hesabı'];
  const rows=secOrder.map(sec=>{
    const items=cells.filter(c=>c.sec===sec);
    if(!items.length) return '';
    const body=items.map(c=>{
      const val=c.pct?c.value+'%':(c.op?c.op+' ':'')+azn2(c.value);
      return `<div class="drow" style="${c.strong?`background:${C('brassBg')}`:''}">
        <span class="dcode${c.code==='—'?' vcode':''}" style="${c.strong?'background:#fff':''}">${c.code}</span>
        <div class="dn"><div class="t">${c.label}${c.verify?` <span class="vflag">${svg(I.warn,{size:10,color:C('review')})} kod təsdiqlənməli</span>`:''}</div>
          <div class="s">${svg(I.scan,{size:11,color:C('inkFaint')})} ${c.src}</div></div>
        <span class="dval" style="color:${c.strong?(loss&&c.code==='3002'?C('flag'):C('brass')):C('ink')};font-weight:${c.strong?700:500}">${val}</span>
      </div>`;
    }).join('');
    return `<div class="dsec2">${sec}</div>${body}`;
  }).join('');
  const notice=loss>0
    ? `Bu dövr <b>zərərlə</b> bağlanır (${azn2(loss)}) — mənfəət vergisi 0. Zərər (3002) növbəti illərə köçürülə bilər (5 il · VM 121?).`
    : period().declareNotice;
  const p=period();
  const icmal=loss>0
    ? `${p.company} · ${p.periodLabel}. Ümumi gəlir ${azn2(di.revenue)}, gəlirdən çıxılan xərclər ${azn2(di.deductible)}. Nəticə: <b>zərər ${azn2(loss)}</b> — mənfəət vergisi 0.`
    : `${p.company} · ${p.periodLabel}. Ümumi gəlir ${azn2(di.revenue)}, gəlirdən çıxılan xərclər ${azn2(di.deductible)}. Vergi tutulan mənfəət <b>${azn2(profit)}</b>, hesablanmış mənfəət vergisi <b>${azn2(tax)}</b>.`;
  return vhead('04','Bəyannamə üzrə icmal',icmal)
    +`<div class="card">${rows}</div>
      <div class="clsactions" style="margin-top:14px">
        <div class="clsstatus" style="color:${C('inkSoft')}">Rəsmi forma: 11 addım · gəlir/xərc/balans/əlavələr</div>
        <div class="clsbtns"><button class="dbtn" data-declopen>${svg(I.file,{size:13,color:'#fff'})} Rəsmi formada aç</button></div>
      </div>
      <div class="noticebar" style="background:${loss>0?C('flagBg'):C('flagBg')};margin-top:14px">${svg(I.warn,{size:15,color:C('flag')})}<p>${notice}</p></div>
      <p style="font-size:11px;color:${C('inkFaint')};margin-top:12px;line-height:1.5">Yuxarıdakı xülasə auditin nəticəsidir. <b>“Rəsmi formada aç”</b> — dövlət platformasındakı MENFEET forması ilə birəbir 11 addımlı görünüş (kodlar və adlar eyni). Real datada bütün göstəricilər ingestion + təsnifatdan doldurulacaq.</p>`;
}

/* ── render ── */
function render(){
  const declform=state.view==='declform';
  document.body.classList.toggle('declform-active',declform);
  document.getElementById('header').style.display=declform?'none':'';
  document.getElementById('footer').style.display=declform?'none':'';
  if(declform){document.getElementById('app').innerHTML=viewDeclForm();return;}
  document.getElementById('header').innerHTML=renderHeader();
  let html;
  switch(state.view){
    case 'audit': html=viewAudit(); break;
    case 'app': html=viewHome(); break;
    case 'how': html=viewHow(); break;
    case 'about': html=viewAbout(); break;
    case 'contact': html=viewContact(); break;
    case 'login': html=viewLogin(); break;
    case 'register': html=viewRegister(); break;
    default: html=viewLanding();
  }
  document.getElementById('app').innerHTML=html;
  document.getElementById('footer').innerHTML=renderFooter();
}

/* ── events ── */
document.addEventListener('click',e=>{
  const au=e.target.closest('[data-auth]');
  if(au){state.authed=true;go('app');return;}
  const lo=e.target.closest('[data-logout]');
  if(lo){state.authed=false;go('landing');return;}
  const open=e.target.closest('[data-open]');
  if(open){openPeriod(open.dataset.open);render();return;}
  const go1=e.target.closest('[data-go]');
  if(go1){go(go1.dataset.go);return;}
  const ct=e.target.closest('[data-contact]');
  if(ct){state.contactSent=true;render();return;}
  const declopen=e.target.closest('[data-declopen]');
  if(declopen){state.declStep=1;state.view='declform';window.scrollTo(0,0);render();return;}
  const declclose=e.target.closest('[data-declclose]');
  if(declclose){state.view='audit';state.step='declare';window.scrollTo(0,0);render();return;}
  const declstep=e.target.closest('[data-declstep]');
  if(declstep){state.declStep=+declstep.dataset.declstep;document.querySelector('.mf-main')&&document.querySelector('.mf-main').scrollTo(0,0);render();return;}
  const declnav=e.target.closest('[data-declnav]');
  if(declnav){state.declStep=Math.max(1,Math.min(11,state.declStep+ +declnav.dataset.declnav));render();return;}
  const dxml=e.target.closest('[data-xml]');
  if(dxml){downloadMenfeetXML();return;}
  const dprint=e.target.closest('[data-print]');
  if(dprint){window.print();return;}
  const st=e.target.closest('[data-step]');
  if(st){state.step=st.dataset.step;render();return;}
  const tg=e.target.closest('[data-toggle]');
  if(tg){const i=tg.dataset.toggle;state.confirmed[i]=!state.confirmed[i];render();return;}
  const analyze=e.target.closest('[data-analyze]');
  if(analyze){if(analyze.hasAttribute('disabled'))return;state.step='classify';window.scrollTo(0,0);render();return;}
  const clsall=e.target.closest('[data-clsall]');
  if(clsall){const pid=state.periodId,del=state.clsDel[pid]||{};period().classify.forEach((_,i)=>{if(!del[i])state.confirmed[i]=true;});render();return;}
  const clsnext=e.target.closest('[data-clsnext]');
  if(clsnext){if(clsnext.hasAttribute('disabled'))return;state.step='reconcile';window.scrollTo(0,0);render();return;}
  const clsdel=e.target.closest('[data-clsdel]');
  if(clsdel){const pid=state.periodId,i=clsdel.dataset.clsdel;(state.clsDel[pid]=state.clsDel[pid]||{})[i]=true;delete state.confirmed[i];render();return;}
  const clsrestore=e.target.closest('[data-clsrestore]');
  if(clsrestore){state.clsDel[state.periodId]={};render();return;}
  const brauto=e.target.closest('[data-brauto]');
  if(brauto){const pid=state.periodId,id=brauto.dataset.brauto;const b=results().find(x=>x.id===id);(state.brResolve[pid]=state.brResolve[pid]||{})[id]={type:'auto',amount:Math.abs(b.residual),basis:autoBasis(b)};state.brCustom=null;render();return;}
  const brco=e.target.closest('[data-brcustomopen]');
  if(brco){state.brCustom=brco.dataset.brcustomopen;render();return;}
  const brcc=e.target.closest('[data-brccancel]');
  if(brcc){state.brCustom=null;render();return;}
  const brca=e.target.closest('[data-brcapply]');
  if(brca){const pid=state.periodId,id=brca.dataset.brcapply;const amtEl=document.querySelector(`[data-brcamt="${id}"]`),bsEl=document.querySelector(`[data-brcbasis="${id}"]`);const amount=amtEl?parseNum(amtEl.value):0;const basis=(bsEl&&bsEl.value.trim())||'Mühasibin izahı';(state.brResolve[pid]=state.brResolve[pid]||{})[id]={type:'custom',amount,basis};state.brCustom=null;render();return;}
  const brconfirm=e.target.closest('[data-brconfirm]');
  if(brconfirm){const pid=state.periodId,id=brconfirm.dataset.brconfirm;(state.brConfirm[pid]=state.brConfirm[pid]||{})[id]=true;render();return;}
  const brunc=e.target.closest('[data-brunconfirm]');
  if(brunc){const pid=state.periodId;if(state.brConfirm[pid])delete state.brConfirm[pid][brunc.dataset.brunconfirm];render();return;}
  const brreset=e.target.closest('[data-brreset]');
  if(brreset){const pid=state.periodId,id=brreset.dataset.brreset;if(state.brResolve[pid])delete state.brResolve[pid][id];if(state.brConfirm[pid])delete state.brConfirm[pid][id];render();return;}
  const brall=e.target.closest('[data-brconfirmall]');
  if(brall){if(brall.hasAttribute('disabled'))return;state.step='declare';window.scrollTo(0,0);render();return;}
  const pr=e.target.closest('[data-prof]');
  if(pr){const k=pr.dataset.prof;state.profile[k]=!state.profile[k];render();return;}
  const rm=e.target.closest('[data-remove]');
  if(rm){delete state.uploads[rm.dataset.remove];render();return;}
  const up=e.target.closest('[data-upload]');
  if(up){state.pendingDoc=up.dataset.upload;const fi=document.getElementById('filepick');fi.value='';fi.click();return;}
});
document.getElementById('filepick').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(f&&state.pendingDoc){
    state.uploads[state.pendingDoc]={name:f.name,size:f.size,meta:'Əlavə edildi · analiz gözləyir',review:false};
    state.pendingDoc=null;render();
  }
});
// MENFEET forma: xana redaktəsi və Ümumi məlumat seçimləri (re-render yoxdur — fokus/scroll qorunur)
document.addEventListener('change',e=>{
  const ed=e.target.closest('[data-mfedit]');
  if(ed){ const pid=state.periodId; (state.mfEdits[pid]=state.mfEdits[pid]||{})[ed.dataset.mfedit]=parseNum(ed.value);
    const sc=document.querySelector('.mf-main'), top=sc?sc.scrollTop:0;
    render();
    const sc2=document.querySelector('.mf-main'); if(sc2)sc2.scrollTop=top;
    return; }
  const gn=e.target.closest('[data-mfgen]');
  if(gn){ mfGenFor(state.periodId)[gn.dataset.mfgen]=gn.value; return; }
  const ca=e.target.closest('[data-clsamt]');
  if(ca){ const pid=state.periodId; (state.clsAmt[pid]=state.clsAmt[pid]||{})[ca.dataset.clsamt]=parseNum(ca.value);
    const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  const le=e.target.closest('[data-lossedit]');
  if(le){ const pid=state.periodId; (state.mfEdits[pid]=state.mfEdits[pid]||{})[le.dataset.lossedit]=parseNum(le.value);
    const y=window.scrollY; render(); window.scrollTo(0,y); return; }
});
render();
</script>
