<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taxclara.az — Bəyannamə hazırlama və uyğunsuzluq auditi</title>
<style>
  :root{
    --paper:#F6F4EE; --card:#FFFFFF; --ink:#14202E; --inkSoft:#51616F;
    --inkFaint:#8A97A2; --hair:#E4E0D6; --hairSoft:#EFECE4;
    --brass:#A67C2E; --brassBg:#F3ECDC;
    --ok:#1E6B52; --okBg:#E7F1EC; --flag:#A5341F; --flagBg:#F6E7E3;
    --review:#9A6A12; --reviewBg:#F5EBD6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.4;
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px;}

  /* masthead */
  header.top{display:flex;align-items:center;justify-content:space-between;
    padding-bottom:20px;border-bottom:1px solid var(--hair);margin-bottom:24px;}
  .brandrow{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .logo{width:36px;height:36px;border-radius:9px;background:var(--ink);
    display:flex;align-items:center;justify-content:center;}
  .brand-t{font-weight:600;font-size:15px;letter-spacing:-.2px;}
  .brand-t .dot{color:var(--brass);}
  .brand-s{font-size:11px;color:var(--inkFaint);margin-top:1px;}
  .statuschip{display:flex;align-items:center;gap:7px;border-radius:999px;
    padding:6px 12px;border:1px solid;font-size:12px;font-weight:500;}

  /* dashboard */
  .dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;}
  .dash-head h1{font-size:20px;font-weight:600;}
  .dash-head p{font-size:12.5px;color:var(--inkSoft);margin-top:4px;}
  .periods{display:grid;gap:12px;}
  .period{display:flex;align-items:center;gap:16px;padding:16px 18px;cursor:pointer;
    transition:border-color .12s,box-shadow .12s;}
  .period:hover{border-color:var(--brass);box-shadow:0 1px 0 var(--brassBg);}
  .period .pic{width:40px;height:40px;border-radius:9px;background:var(--ink);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .period .co{flex:1;min-width:0;}
  .period .co .nm{font-weight:600;font-size:14.5px;}
  .period .co .meta{font-size:11.5px;color:var(--inkFaint);margin-top:3px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .period .yr{font-family:ui-monospace,monospace;font-size:12px;color:var(--inkSoft);
    padding:3px 9px;border-radius:6px;background:var(--hairSoft);}

  /* layout */
  .cols{display:flex;gap:24px;}
  nav.steps{width:208px;flex-shrink:0;}
  .backrow{margin-bottom:14px;}
  .backbtn{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--inkSoft);
    background:transparent;border:none;cursor:pointer;padding:4px 0;}
  .backbtn:hover{color:var(--ink);}
  .steplist{display:flex;flex-direction:column;gap:6px;}
  .step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;
    text-align:left;background:transparent;border:none;cursor:pointer;color:var(--inkSoft);
    font-size:13px;font-family:inherit;width:100%;transition:background .12s;}
  .step:hover{background:var(--hairSoft);}
  .step.on{background:var(--ink);color:#fff;}
  .step .num{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:2px;color:var(--inkFaint);}
  .step.on .num{color:var(--brass);}
  .step .lbl{flex:1;font-weight:500;}
  .step .fdot{width:6px;height:6px;border-radius:999px;background:var(--flag);}
  .step.on .fdot{background:var(--brass);}
  main{flex:1;min-width:0;}

  /* view head */
  .vhead{margin-bottom:20px;}
  .vhead .r{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .vhead .n{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:3px;color:var(--brass);}
  .vhead h2{font-size:18px;font-weight:600;}
  .vhead p{font-size:12.5px;color:var(--inkSoft);max-width:560px;}

  /* generic */
  .card{background:var(--card);border:1px solid var(--hair);border-radius:12px;}
  .pill{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}

  /* sources */
  .src{display:flex;gap:14px;padding:16px;}
  .src .ic{width:36px;height:36px;border-radius:9px;background:var(--hairSoft);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .src .nm{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .src .nm span{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .src .note{font-size:11.5px;color:var(--inkFaint);margin-top:2px;}
  .src .det{font-size:12px;color:var(--inkSoft);margin-top:6px;}

  /* sources — sənəd yükləmə */
  .profwrap{margin-bottom:16px;}
  .proflbl{font-size:11.5px;color:var(--inkFaint);margin-bottom:8px;}
  .profbar{display:flex;gap:8px;flex-wrap:wrap;}
  .ptog{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-family:inherit;cursor:pointer;
    padding:7px 12px;border-radius:999px;border:1px solid var(--hair);background:var(--card);color:var(--inkSoft);transition:all .12s;}
  .ptog .pdot{width:8px;height:8px;border-radius:999px;background:var(--inkFaint);flex-shrink:0;transition:background .12s;}
  .ptog.on{border-color:var(--ink);background:var(--ink);color:#fff;}
  .ptog.on .pdot{background:var(--brass);}
  .docs{display:grid;gap:10px;}
  .doc{display:flex;gap:14px;padding:14px 16px;align-items:center;}
  .doc .ic{width:36px;height:36px;border-radius:9px;background:var(--hairSoft);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .dmain{flex:1;min-width:0;}
  .dt{font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .condtag{font-size:10px;font-weight:500;padding:1px 7px;border-radius:999px;
    background:var(--brassBg);color:var(--brass);border:1px solid var(--brass)33;}
  .dwhy{font-size:11.5px;color:var(--inkFaint);margin-top:3px;}
  .dfile{font-size:11.5px;color:var(--inkSoft);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .dfile .fn{font-weight:500;}
  .dfile .fsz{color:var(--inkFaint);}
  .dfile .fmeta{color:var(--inkFaint);}
  .dact{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
  .dbtns{display:flex;align-items:center;gap:6px;}
  .dbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-family:inherit;cursor:pointer;
    padding:6px 12px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;transition:opacity .12s;}
  .dbtn:hover{opacity:.88;}
  .dbtn.ghost{background:transparent;color:var(--inkSoft);border-color:var(--hair);}
  .dbtn.del{background:transparent;border-color:var(--hair);padding:6px 8px;}
  .dsec{font-size:12px;font-weight:600;color:var(--ink);margin:22px 0 10px;}
  .dsec span{font-weight:400;color:var(--inkFaint);}
  @media(max-width:640px){
    .doc{flex-wrap:wrap;}
    .dact{flex-direction:row;width:100%;justify-content:space-between;align-items:center;}
  }

  /* classify */
  .cprog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--inkSoft);margin-bottom:12px;}
  .cprog b{color:var(--ink);}
  .crow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hairSoft);}
  .crow:last-child{border-bottom:none;}
  .chk{width:20px;height:20px;border-radius:6px;border:1px solid var(--inkFaint);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:transparent;}
  .chk.on{background:var(--ok);border-color:var(--ok);}
  .crow .cn{flex:1;min-width:0;}
  .crow .cn .t{font-weight:500;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .crow .cn .norm{font-size:11px;color:var(--inkFaint);margin-top:2px;}
  .normtag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--review);}
  .amt{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--inkSoft);}

  /* reconcile */
  .stats{display:flex;gap:12px;margin-bottom:16px;}
  .stat{flex:1;border:1px solid var(--hair);background:var(--card);border-radius:9px;padding:10px 14px;}
  .stat .v{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;line-height:1;}
  .stat .l{font-size:11px;color:var(--inkFaint);margin-top:6px;}
  .bridges{display:grid;gap:14px;}
  .bhead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--hairSoft);}
  .bhead .t{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;}
  .bbody{padding:16px 20px;}
  .brow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;}
  .brow .lb{font-size:12.5px;}
  .brow .vl{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;}
  .basis{font-size:11px;line-height:1.35;margin-top:2px;padding-left:12px;color:var(--inkFaint);}
  .bline{margin-top:8px;}
  .bsep{margin-top:12px;padding-top:12px;border-top:1px solid var(--hairSoft);}
  .verdict{margin-top:12px;border-radius:9px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;}
  .verdict .vt{font-size:12.5px;font-weight:500;}
  .verdict .vn{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;}
  .verdict p{font-size:12px;line-height:1.35;margin-top:4px;color:var(--inkSoft);}

  /* declaration */
  .drow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--hairSoft);}
  .drow:last-child{border-bottom:none;}
  .dcode{font-family:ui-monospace,monospace;font-size:11px;padding:2px 6px;border-radius:4px;background:var(--hairSoft);color:var(--inkSoft);}
  .drow .dn{flex:1;min-width:0;}
  .drow .dn .t{font-weight:500;font-size:13px;}
  .drow .dn .s{font-size:11px;color:var(--inkFaint);margin-top:2px;display:flex;align-items:center;gap:4px;}
  .dval{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13.5px;}
  .noticebar{margin-top:12px;border-radius:9px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start;background:var(--flagBg);}
  .noticebar p{font-size:12px;line-height:1.35;color:var(--inkSoft);}

  footer{margin-top:32px;padding-top:20px;border-top:1px solid var(--hair);
    font-size:11px;line-height:1.6;color:var(--inkFaint);}

  @media(max-width:760px){
    .cols{flex-direction:column;}
    nav.steps{width:100%;}
    .steplist{flex-direction:row;overflow-x:auto;padding-bottom:4px;}
    .step{white-space:nowrap;}
  }
  .hide-sm{}
  @media(max-width:640px){.hide-sm{display:none!important;}}

  /* ══ ictimai sayt ══ */
  /* public header */
  .pubhead{display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:16px 0;border-bottom:1px solid var(--hair);margin-bottom:32px;}
  .pubnav{display:flex;align-items:center;gap:4px;}
  .pubnav a{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--inkSoft);cursor:pointer;transition:all .12s;}
  .pubnav a:hover{background:var(--hairSoft);color:var(--ink);}
  .pubnav a.on{color:var(--ink);font-weight:500;}
  .pubauth{display:flex;align-items:center;gap:8px;}
  .btnp{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-family:inherit;cursor:pointer;
    padding:9px 16px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:#fff;transition:opacity .12s;}
  .btnp:hover{opacity:.88;}
  .btnp.brass{background:var(--brass);border-color:var(--brass);}
  .btng{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-family:inherit;cursor:pointer;
    padding:9px 16px;border-radius:9px;border:1px solid var(--hair);background:transparent;color:var(--ink);transition:all .12s;}
  .btng:hover{border-color:var(--ink);}
  .btnp.lg,.btng.lg{padding:12px 22px;font-size:14px;}

  /* hero */
  .hero{text-align:center;padding:40px 0 44px;}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--brass);
    background:var(--brassBg);border:1px solid var(--brass)33;padding:6px 12px;border-radius:999px;margin-bottom:20px;}
  .hero h1{font-size:38px;line-height:1.12;font-weight:700;letter-spacing:-.5px;max-width:720px;margin:0 auto;}
  .hero h1 .hl{color:var(--brass);}
  .hero .lead{font-size:15.5px;line-height:1.55;color:var(--inkSoft);max-width:560px;margin:18px auto 26px;}
  .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .trust{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-top:30px;
    font-size:12px;color:var(--inkFaint);}
  .trust span{display:inline-flex;align-items:center;gap:6px;}

  /* section */
  .section{padding:38px 0;border-top:1px solid var(--hair);}
  .section-h{text-align:center;margin-bottom:30px;}
  .section-h .k{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:3px;color:var(--brass);}
  .section-h h2{font-size:26px;font-weight:700;letter-spacing:-.3px;margin-top:8px;}
  .section-h p{font-size:14px;color:var(--inkSoft);max-width:560px;margin:10px auto 0;}

  /* features */
  .fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:760px){.fgrid{grid-template-columns:1fr;}}
  .fcard{padding:20px;}
  .fcard .fi{width:40px;height:40px;border-radius:10px;background:var(--ink);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .fcard h3{font-size:15px;font-weight:600;margin-bottom:6px;}
  .fcard p{font-size:12.5px;line-height:1.5;color:var(--inkSoft);}

  /* how it works — steps */
  .flow{display:grid;gap:14px;}
  .flowstep{display:flex;gap:18px;padding:20px;align-items:flex-start;}
  .flowstep .fnum{width:38px;height:38px;border-radius:999px;background:var(--brassBg);color:var(--brass);
    font-family:ui-monospace,monospace;font-weight:600;font-size:15px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .flowstep .fbody h3{font-size:15px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:9px;}
  .flowstep .fbody p{font-size:13px;line-height:1.5;color:var(--inkSoft);}

  /* about */
  .prose{max-width:680px;margin:0 auto;}
  .prose p{font-size:14px;line-height:1.65;color:var(--inkSoft);margin-bottom:14px;}
  .prose p b{color:var(--ink);}
  .statline{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
  .statbox{flex:1;min-width:150px;text-align:center;padding:18px;}
  .statbox .sv{font-family:ui-monospace,monospace;font-size:26px;font-weight:700;color:var(--ink);}
  .statbox .sl{font-size:12px;color:var(--inkFaint);margin-top:5px;}

  /* faq */
  .faq{max-width:720px;margin:0 auto;display:grid;gap:10px;}
  .faqitem{padding:16px 18px;}
  .faqitem h4{font-size:13.5px;font-weight:600;margin-bottom:6px;}
  .faqitem p{font-size:12.5px;line-height:1.5;color:var(--inkSoft);}

  /* contact + auth forms */
  .formwrap{max-width:460px;margin:0 auto;}
  .authcard{padding:30px 28px;}
  .authcard .ah{text-align:center;margin-bottom:22px;}
  .authcard .ah h2{font-size:20px;font-weight:600;}
  .authcard .ah p{font-size:12.5px;color:var(--inkSoft);margin-top:6px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--inkSoft);margin-bottom:6px;}
  .field input,.field textarea,.field select{width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);
    padding:10px 12px;border:1px solid var(--hair);border-radius:9px;background:var(--paper);transition:border-color .12s;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--brass);}
  .field textarea{resize:vertical;min-height:96px;}
  .field2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.field2{grid-template-columns:1fr;}}
  .formrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--inkSoft);margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .formrow label{display:flex;align-items:center;gap:7px;cursor:pointer;}
  .formrow a{color:var(--brass);cursor:pointer;}
  .authswap{text-align:center;font-size:12.5px;color:var(--inkSoft);margin-top:16px;}
  .authswap a{color:var(--brass);cursor:pointer;font-weight:500;}
  .fnote{font-size:11px;color:var(--inkFaint);text-align:center;margin-top:16px;line-height:1.5;}
  .okmsg{background:var(--okBg);color:var(--ok);border:1px solid var(--ok)33;border-radius:9px;
    padding:12px 14px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start;margin-bottom:16px;}

  /* public footer */
  .pubfooter{margin-top:44px;padding-top:26px;border-top:1px solid var(--hair);}
  .pfftop{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px;}
  .pfcol h5{font-size:12px;font-weight:600;margin-bottom:10px;}
  .pfcol a{display:block;font-size:12.5px;color:var(--inkSoft);padding:3px 0;cursor:pointer;}
  .pfcol a:hover{color:var(--ink);}
  .pfbrand{max-width:280px;}
  .pfbrand p{font-size:12px;color:var(--inkFaint);line-height:1.55;margin-top:10px;}
  .pfbot{font-size:11px;line-height:1.6;color:var(--inkFaint);border-top:1px solid var(--hairSoft);padding-top:16px;}

  @media(max-width:640px){
    .hero h1{font-size:29px;}
    .pubnav{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="header"></div>
  <div id="app"></div>
  <input type="file" id="filepick" style="display:none" accept=".pdf,.xlsx,.xls,.csv,.xml,.png,.jpg,.jpeg" />
  <div id="footer"></div>
</div>

<script>
/* ── icons ── */
const I = {
  scale:'<path d="M16 16l3-8 3 8c-2 1.5-4 1.5-6 0"/><path d="M2 16l3-8 3 8c-2 1.5-4 1.5-6 0"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  sheet:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8M8 9h2"/>',
  bank:'<path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M9 21v-6h6v6"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><path d="M8 7h8M8 11h8M8 15h5"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  building:'<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M9 6h6M9 10h6M9 14h6M9 18h6"/>',

// Deterministik format — dizayn dili: minliklər boşluqla ("1 245 000 ₼")
function azn(n){
  const r=Math.round(n), abs=Math.abs(r);
  const g=String(abs).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (r<0?'− ':'')+g+' ₼';
}

/* ── körpü mühərriki (src/domain/reconciliation/engine.ts ilə eyni məntiq) ── */
function runBridge(b){
  const adj=b.lines.reduce((s,l)=>s+l.value,0);
  const expected=Math.round((b.start.value+adj)*100)/100;
  const residual=Math.round((expected-b.actual.value)*100)/100;
  return {...b,expected,residual,flagged:Math.abs(residual)>b.tol};
}

function bridge(b){
  const flagged=b.flagged;
  const sc=flagged?C('flag'):C('ok'), sbg=flagged?C('flagBg'):C('okBg');
  const lines=b.lines.map(l=>`<div class="bline">${brow(l.label,l.value,{muted:true})}<div class="basis">${l.basis}</div></div>`).join('');
  const verdictMsg=flagged?(b.note||'Bu məbləğ bilinən qanuni düzəlişlərlə izah olunmur — təqdimatdan əvvəl yoxlanmalıdır.'):'';
  return `<div class="card">
    <div class="bhead">
      <div class="t">${flagged?svg(I.warn,{size:17,color:C('flag')}):svg(I.ok,{size:17,color:C('ok')})}${b.title}</div>
      ${pill(flagged?`İzahsız ${azn(Math.abs(b.residual))}`:'Uzlaşdı',flagged?'flag':'ok',flagged?'flagBg':'okBg')}
    </div>
    <div class="bbody">
      ${brow(b.start.label,b.start.value,{strong:true})}
      ${lines}
      <div class="bsep">${brow(b.expectedLabel,b.expected,{accent:true})}</div>
      <div style="margin-top:6px">${brow(b.actual.label,b.actual.value)}</div>
      <div class="verdict" style="background:${sbg}">
        <div style="margin-top:1px">${flagged?svg(I.warn,{size:16,color:C('flag')}):svg(I.check,{size:16,color:C('ok')})}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <span class="vt" style="color:${sc}">${flagged?'İzah olunmayan qalıq':'Tam izah olundu'}</span>
            <span class="vn" style="color:${sc}">${azn(Math.abs(b.residual))}</span>
          </div>
          ${verdictMsg?`<p>${verdictMsg}</p>`:''}
        </div>
      </div>
    </div>
  </div>`;
}

        <div class="field"><label>Ad, soyad</label><input type="text" placeholder="Adınız" /></div>
        <div class="field"><label>Firma adı</label><input type="text" placeholder="MMC / firma" /></div>
      </div>
      <div class="field2">
        <div class="field"><label>VÖEN</label><input type="text" placeholder="10 rəqəm" inputmode="numeric" /></div>
        <div class="field"><label>Telefon</label><input type="tel" placeholder="+994 ..." /></div>
      </div>
      <div class="field"><label>E-poçt</label><input type="email" placeholder="ad@sirket.az" /></div>
      <div class="field"><label>Parol</label><input type="password" placeholder="ən azı 8 simvol" /></div>
      <div class="formrow"><label><input type="checkbox" /> <span>İstifadə şərtləri və məxfilik siyasəti ilə razıyam</span></label></div>
      <button class="btnp brass" style="width:100%;justify-content:center" data-auth="register">Hesab yarat</button>
      <div class="authswap">Artıq hesabın var? <a data-go="login">Giriş et</a></div>
      <p class="fnote">Nümayiş rejimi — real qeydiyyat və məlumat saxlama backend Faza 1-də qurulacaq. Şəxsi məlumat daxil etməyin.</p>
    </div></div>
  </section>`;
}

/* ── render ── */
function render(){
  document.getElementById('header').innerHTML=renderHeader();
  let html;
  switch(state.view){
    case 'audit': html=viewAudit(); break;
    case 'app': html=viewHome(); break;
    case 'how': html=viewHow(); break;
    case 'about': html=viewAbout(); break;
    case 'contact': html=viewContact(); break;
    case 'login': html=viewLogin(); break;
    case 'register': html=viewRegister(); break;
    default: html=viewLanding();
  }
  document.getElementById('app').innerHTML=html;
  document.getElementById('footer').innerHTML=renderFooter();
}

/* ── events ── */
document.addEventListener('click',e=>{
  const au=e.target.closest('[data-auth]');
  if(au){state.authed=true;go('app');return;}
  const lo=e.target.closest('[data-logout]');
  if(lo){state.authed=false;go('landing');return;}
  const open=e.target.closest('[data-open]');
  if(open){openPeriod(open.dataset.open);render();return;}
  const go1=e.target.closest('[data-go]');
  if(go1){go(go1.dataset.go);return;}
  const ct=e.target.closest('[data-contact]');
  if(ct){state.contactSent=true;render();return;}
  const st=e.target.closest('[data-step]');
  if(st){state.step=st.dataset.step;render();return;}
  const tg=e.target.closest('[data-toggle]');
  if(tg){const i=tg.dataset.toggle;state.confirmed[i]=!state.confirmed[i];render();return;}
  const pr=e.target.closest('[data-prof]');
  if(pr){const k=pr.dataset.prof;state.profile[k]=!state.profile[k];render();return;}
  const rm=e.target.closest('[data-remove]');
  if(rm){delete state.uploads[rm.dataset.remove];render();return;}
  const up=e.target.closest('[data-upload]');
  if(up){state.pendingDoc=up.dataset.upload;const fi=document.getElementById('filepick');fi.value='';fi.click();return;}
});
document.getElementById('filepick').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(f&&state.pendingDoc){
    state.uploads[state.pendingDoc]={name:f.name,size:f.size,meta:'Əlavə edildi · analiz gözləyir',review:false};
    state.pendingDoc=null;render();
  }
});
render();
</script>
